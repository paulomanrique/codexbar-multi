packages:
  - apps/*
  - packages/*
  - scripts
  # Git checks out upstream `Scripts/` and port tooling `scripts/` into one
  # case-insensitive directory on Windows. Match that physical casing too.
  - Scripts

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  msgpackr-extract: true
  quickjs-emscripten: true

catalog:
  "@effect/atom-react": 4.0.0-beta.103
  "@effect/platform-bun": 4.0.0-beta.103
  "@effect/platform-node": 4.0.0-beta.103
  "@effect/sql-sqlite-node": 4.0.0-beta.103
  "@effect/tsgo": 0.13.2
  "@effect/vitest": 4.0.0-beta.103
  "@napi-rs/keyring": 1.3.0
  "@napi-rs/keyring-darwin-arm64": 1.3.0
  "@napi-rs/keyring-darwin-x64": 1.3.0
  "@napi-rs/keyring-linux-arm64-gnu": 1.3.0
  "@napi-rs/keyring-linux-arm64-musl": 1.3.0
  "@napi-rs/keyring-linux-x64-gnu": 1.3.0
  "@napi-rs/keyring-linux-x64-musl": 1.3.0
  "@napi-rs/keyring-win32-arm64-msvc": 1.3.0
  "@napi-rs/keyring-win32-x64-msvc": 1.3.0
  "@types/node": 24.12.4
  "@types/react": ~19.2.14
  "@types/react-dom": ~19.2.3
  "@typescript/native-preview": 7.0.0-dev.20260604.1
  effect: 4.0.0-beta.103
  electron: 41.5.0
  electron-builder: 26.15.6
  quickjs-emscripten: 0.32.0
  postject: 1.0.0-alpha.6
  react: 19.2.6
  react-dom: 19.2.6
  sucrase: 3.35.1
  typescript: ~6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.2.2
  vite-plus: 0.2.2

minimumReleaseAgeExclude:
  - "@effect/atom-react@4.0.0-beta.103"
  - "@effect/platform-bun@4.0.0-beta.103"
  - "@effect/platform-node@4.0.0-beta.103"
  - "@effect/sql-sqlite-node@4.0.0-beta.103"
  - "@effect/tsgo@0.13.2"
  - "@effect/vitest@4.0.0-beta.103"
  - "@napi-rs/keyring@1.3.0"
  - "@napi-rs/keyring-darwin-arm64@1.3.0"
  - "@napi-rs/keyring-darwin-x64@1.3.0"
  - "@napi-rs/keyring-linux-arm64-gnu@1.3.0"
  - "@napi-rs/keyring-linux-arm64-musl@1.3.0"
  - "@napi-rs/keyring-linux-x64-gnu@1.3.0"
  - "@napi-rs/keyring-linux-x64-musl@1.3.0"
  - "@napi-rs/keyring-win32-arm64-msvc@1.3.0"
  - "@napi-rs/keyring-win32-x64-msvc@1.3.0"
  - "effect@4.0.0-beta.103"

overrides:
  "@effect/atom-react": "catalog:"
  "@effect/platform-bun": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/sql-sqlite-node": "catalog:"
  "@effect/tsgo": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/vitest>vitest": "-"
  "@napi-rs/keyring": "catalog:"
  "@types/node": "catalog:"
  effect: "catalog:"
  vite: "catalog:"

packageExtensions:
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"
    peerDependenciesMeta:
      vitest:
        optional: true
  vite-plus@*:
    dependencies:
      vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
