# Semantic per-provider migration matrix for the CodexBar 0.54.0 oracle.
#
# Each entry is intentionally explicit so an upstream change can be traced from
# Swift source/tests/fixtures to the expected and actual TypeScript implementation.
# `partial` requires a real TS module and a TS test; `parity` additionally requires
# an accepted Swift-oracle comparison. `unported` may still have a mechanical TS
# file under migration, but it is not counted as behaviorally ported yet.
