    tests:
      - Tests/CodexBarTests/Widget*Tests.swift
    fixtures: []
    status: not-applicable
    lastReviewedCommit: 453174fe13eebdf403cc0776268eb2b101fd9553

  - id: provider-mapping
    description: Canonical 69-provider roster, per-provider Swift implementations and TS registry mapping.
    swiftGlobs:
      - Sources/CodexBarCore/Providers/*/*.swift
      - Sources/CodexBar/Providers/**/*.swift
    tsPaths:
      - packages/providers/src/registry.ts
      - packages/providers/src/providers/**/*.ts
      - packages/contracts/src/provider.ts
    tests:
      - Tests/CodexBarTests/*Provider*Tests.swift
      - TestsLinux/*Provider*Tests.swift
      - packages/providers/test/**/*.test.ts
    fixtures:
      - Tests/CodexBarTests/Fixtures/Providers/**/*
      - Tests/CodexBarTests/Fixtures/QwenCloud/*
