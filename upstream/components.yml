    lastReviewedCommit: 453174fe13eebdf403cc0776268eb2b101fd9553

  - id: apple-only-exclusions
    description: WidgetKit, iCloud/CloudKit and Sparkle are intentionally excluded from CodexBar Multi.
    swiftGlobs:
      - Sources/CodexBarWidget/**/*.swift
      - WidgetExtension/**/*.swift
      - Sources/CodexBar/**/*iCloud*.swift
      - Sources/CodexBar/**/*CloudKit*.swift
      - Sources/CodexBar/**/*Sparkle*.swift
